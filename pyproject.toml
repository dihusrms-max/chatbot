[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dihusrms", email = "dihusrms@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.1.0",
    "openai>=3.22.1",
    "plotly>=7.1.0",
    "plotly-express>=0.4.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.64.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
